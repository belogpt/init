# Default settings for the VPS bootstrap tool.
INIT_VERSION="0.4.0"
INIT_REGISTERED_MODULES=(system packages docker git ssh_key firewall security)
declare -A INIT_MODULE_DESCRIPTIONS=([system]="Validate supported Ubuntu/Debian platform prerequisites" [packages]="Install base apt packages" [docker]="Install Docker Engine and Compose plugin" [git]="Configure target user's global Git identity" [ssh_key]="Create/check target user's SSH key" [firewall]="Install and enable UFW rules" [security]="Install basic security packages")
declare -A INIT_MODULE_DEFAULTS=([system]=1 [packages]=1 [docker]=1 [git]=1 [ssh_key]=1 [firewall]=1 [security]=1)
declare -A INIT_MODULE_DEPS=([system]="" [packages]="system" [docker]="packages" [git]="packages" [ssh_key]="packages" [firewall]="packages" [security]="packages")
BASE_PACKAGES=(git ca-certificates curl gnupg lsb-release openssh-client)
SECURITY_PACKAGES=(fail2ban unattended-upgrades needrestart)
DOCKER_PACKAGES=(docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin)
DOCKER_GPG_FINGERPRINT="9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
UPGRADE="${UPGRADE:-0}"; ASSUME_YES="${ASSUME_YES:-0}"; INIT_DEBUG="${INIT_DEBUG:-0}"; INIT_NO_COLOR="${INIT_NO_COLOR:-0}"; OUTPUT_FORMAT="${OUTPUT_FORMAT:-text}"; INIT_LANG="${INIT_LANG:-auto}"
TARGET_USER="${TARGET_USER:-}"; SSH_KEY_PATH="${SSH_KEY_PATH:-~/.ssh/id_ed25519}"; SSH_KEY_COMMENT="${SSH_KEY_COMMENT:-server-$(hostname)}"; GIT_NAME="${GIT_NAME:-}"; GIT_EMAIL="${GIT_EMAIL:-}"
ALLOW_HTTP="${ALLOW_HTTP:-0}"; ALLOW_HTTPS="${ALLOW_HTTPS:-0}"; REPAIR_PERMISSIONS="${REPAIR_PERMISSIONS:-0}"; FORCE_APPLY="${FORCE_APPLY:-0}"; ALLOW_PORTS=()
