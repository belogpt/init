# Default settings for the VPS bootstrap tool.
INIT_VERSION="0.2.0"
INIT_MODULES=(system)
BASE_PACKAGES=(git ca-certificates curl gnupg lsb-release openssh-client)
SECURITY_PACKAGES=(fail2ban unattended-upgrades needrestart)
DOCKER_PACKAGES=(docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin)
SKIP_UPGRADE="${SKIP_UPGRADE:-0}"
ASSUME_YES="${ASSUME_YES:-0}"
INIT_DEBUG="${INIT_DEBUG:-0}"
SSH_KEY_PATH="${SSH_KEY_PATH:-${HOME}/.ssh/id_ed25519}"
SSH_KEY_COMMENT="${SSH_KEY_COMMENT:-server-$(hostname)}"
GIT_NAME="${GIT_NAME:-}"
GIT_EMAIL="${GIT_EMAIL:-}"
ALLOW_HTTP="${ALLOW_HTTP:-0}"
ALLOW_HTTPS="${ALLOW_HTTPS:-0}"
ALLOW_PORTS=()
